services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://crm:crm_local_only@postgres:5432/brokerage_crm
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-development-jwt-secret-change-me
      FIELD_ENCRYPTION_KEY: c2VjdXJlLWxvY2FsLWtleS1mb3ItY3JtLWFwcC0zMiE=
      WEBHOOK_SIGNING_SECRET: local-webhook-secret-change-me
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brokerage_crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_local_only
    ports: ["5432:5432"]
    volumes: [crm_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d brokerage_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports: ["5678:5678"]
    volumes: [n8n_data:/home/node/.n8n]
    depends_on:
      redis: { condition: service_healthy }

volumes:
  crm_postgres:
  n8n_data:
